name: demo notebook

# Builds examples/demo.py (a `# %%` cell file) into examples/demo.ipynb with jupytext, so it can be
# opened in Colab. On pushes to main the notebook is force-pushed to the orphan `demo` branch, which
# the README's "Open in Colab" badge points at; on pull requests it is only built, as a check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jupytext nbformat
      - name: Convert the cell files to notebooks
        run: |
          set -e
          for f in examples/*.py; do
            case "$f" in examples/make_gif.py) continue;; esac
            jupytext --to ipynb "$f"
          done
          ls -la examples/*.ipynb
      - name: Publish to the demo branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -e
          mkdir -p /tmp/demo/examples
          cp examples/*.ipynb /tmp/demo/examples/
          cp README.md LICENSE /tmp/demo/
          cd /tmp/demo
          git init -q -b demo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > README.md <<'EOF'
          # liveplot demo notebooks

          Generated by CI from `examples/*.py` on `main`; do not edit here.
          Open in Colab: https://colab.research.google.com/github/ARENA-education/liveplot/blob/demo/examples/demo.ipynb
          EOF
          git add -A
          git commit -q -m "Build demo notebooks from main ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
